<radialGradient id="boom" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6d6"/><stop offset="0.4" stop-color="#ffb347"/><stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/></radialGradient>
