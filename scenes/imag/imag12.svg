<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#0b0b0e"/><defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14121c"/><stop offset="1" stop-color="#3a2a36"/></linearGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="70%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/></radialGradient>
<radialGradient id="pinkglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd1e6" stop-opacity="1"/><stop offset="0.35" stop-color="#ff7fb2" stop-opacity="0.85"/><stop offset="1" stop-color="#ff7fb2" stop-opacity="0"/></radialGradient>
